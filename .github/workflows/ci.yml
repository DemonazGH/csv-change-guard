name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Engine, build, and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Run engine, scenario, and package tests
        run: npm test

      - name: Verify the committed standalone build
        run: |
          git ls-files --error-unmatch dist/index.html > /dev/null
          npm run build
          git diff --exit-code -- dist/index.html

      - name: Build internal beta package
        run: npm run package:beta -- --output .local-test-artifacts/release

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements-browser.txt

      - name: Install browser test dependencies
        run: |
          python -m pip install --requirement tests/requirements-browser.txt
          python -m pip check
          # Use the runner's packaged Chrome and its Ubuntu sandbox integration.
          # Do not select the runner's separately downloaded Chromium snapshot.
          ccg_chrome_path="$(command -v google-chrome)"
          "$ccg_chrome_path" --version
          printf 'CHROMIUM_PATH=%s\n' "$ccg_chrome_path" >> "$GITHUB_ENV"

      - name: Run browser smoke tests with sandboxing enabled
        run: bash scripts/ci-browser.sh

      - name: Verify internal package and commerce drafts with sandboxing enabled
        run: |
          ccg_candidate_version="$(node -p "require('./package.json').version + '-beta.1'")"
          python tests/beta_preview_test.py \
            --package-dir ".local-test-artifacts/release/${ccg_candidate_version}/CSV-Change-Guard" \
            --archive ".local-test-artifacts/release/${ccg_candidate_version}/csv-change-guard-${ccg_candidate_version}.zip" \
            --artifacts-dir .local-test-artifacts/ci/beta-preview

      - name: Save browser results and server log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-results-${{ github.run_attempt }}
          path: .local-test-artifacts/ci/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
